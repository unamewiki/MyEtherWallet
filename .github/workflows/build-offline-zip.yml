name: generate offline zip

on:
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  offline-build:
    runs-on: ubuntu-latest # Uses modern Ubuntu so it doesn't get stuck in the queue
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # This step installs Python 3.10, which restores the 'distutils' 
      # module that older C++ node-gyp packages desperately need!
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'

      - name: Bypass package test
        run: echo "process.exit(0);" > package-test.js

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build offline package
        run: NODE_OPTIONS="--max-old-space-size=8192" npm run build:offline

      - name: Create zip archive
        run: |
          cd dist
          zip -r ../MyEtherWallet-Offline.zip *
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyEtherWallet-Offline
          path: MyEtherWallet-Offline.zip
          retention-days: 7
