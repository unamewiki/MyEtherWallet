name: generate offline zip

on:
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  offline-build:
    # Use Ubuntu 20.04 to guarantee Python 3.8 (which includes distutils)
    runs-on: ubuntu-20.04 
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm' # This automatically handles caching for you!

      - name: Bypass package test
        run: echo "process.exit(0);" > package-test.js

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build offline package
        # Allocate extra memory to prevent Webpack from crashing
        run: NODE_OPTIONS="--max-old-space-size=8192" npm run build:offline

      - name: Create zip archive
        run: |
          cd dist
          zip -r ../MyEtherWallet-Offline.zip *
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyEtherWallet-Offline
          path: MyEtherWallet-Offline.zip
          retention-days: 7
